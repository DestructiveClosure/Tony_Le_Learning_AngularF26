<div class="container">
  @for (course of courses; track course.id){
    <div class="course-card">
      <h1>{{course.title}}</h1>
      <p>{{course.description}}</p>
      <p id="course-price">{{course.price}}</p>
      <p>Sold Out? {{course.soldOut ? "Yes" : "No"}}</p>
      @if(course.price < 150 ){
        <div class="special-offer">Special Offer</div>
      }
      @if(course.hasNewCourses){
        <div class="new-courses">New Courses</div>
      }
      <button (click)="courseInfo(course.title)">View Details</button>
    </div>
  }@empty{
    <div>There are no courses available at this time</div>
  }
</div>
